version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: krono-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: krono
      POSTGRES_USER: krono
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krono"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./krono-api
      dockerfile: Dockerfile
    container_name: krono-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/krono
      SPRING_DATASOURCE_USERNAME: krono
      SPRING_DATASOURCE_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./krono-web
      dockerfile: Dockerfile
    container_name: krono-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
